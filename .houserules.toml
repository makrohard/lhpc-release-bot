# The house-rules profile of this Python repository, for LoRaHAM Pi Control's tools/check_houserules.py
# (`check_houserules.py <base>..<head>`, run in this repository). The checker reads it at <base>, so a range
# cannot relax its own rules. Attribution, markers and the HARD patterns are the checker's own and apply as
# in every repository.

# The tests: every tests/test_*.py file is one layer; each `def test_` line is one test.
layers = [["tests/", "bot"]]
test_files = ["test_*.py"]
test_def = '(async )?def test_'

# No module budgets: the budget table and the family directory belong to LoRaHAM Pi Control.
budget_file = ""
family_dir = ""

changelog = "CHANGELOG.md"

[warn_patterns]
sleep = 'time\.sleep\('
network = '\b(requests\.|urllib\.request|socket\.create_connection)'
