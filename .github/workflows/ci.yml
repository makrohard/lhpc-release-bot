# The bot's own gate: its rules are tested before it is ever allowed to run them against three
# public repositories. Everything here is offline — the remotes are fakes.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8   # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest ruff
      - run: ruff check bot tests
      - run: python -m pytest -q
      - name: The policy names every pinned source in the live manifest
        # A new pinned source upstream must not silently go untracked: the run would refuse at
        # its first stage, but this says so on every push here instead.
        run: python -m tests.policy_covers_manifest
