# What this bot may move, and what it only reports.
#
# The manifest is the source of truth for the pins themselves; this file is the source of truth
# for HOW each one is allowed to advance. Every pinned source in the manifest must appear here:
# a source with no rule stops the run, because a pin nobody wrote a rule for is a pin nobody
# decided to automate.
#
#   track = "tip"      follow the declared branch's tip
#   track = "tag"      follow the newest version-shaped tag on that branch (v1.2.3, 1.5.2, v112)
#   track = "release"  follow the newest GitHub release that is neither a draft nor a prerelease
#   track = "manual"   REPORT only — never moved by this bot
#
# A move is only ever forward and only ever on the declared branch: the candidate must be a
# descendant of the current pin and an ancestor of the branch tip. Anything else is reported as
# a fault, never applied.

[source."src/loraham-daemon"]
track = "manual"
why = "the real daemon needs a radio to start; the test lab cannot prove it, so it moves by hand with the box test matrix"

# READINESS REHEARSAL 2026-09-10 — restore to `track = "manual"` when it ends.
