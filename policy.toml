[source."src/reticulum"]
track = "tip"
why = "upstream's git tags lag its releases (2026-09-25: newest tag 1.5.2, PyPI and master's _version.py 1.5.4, master 72 commits past the tag), and the maintainer wants the latest development state; tag tracking would hold the pin at 1.5.2"

[source."src/nomadnet"]
track = "tip"
why = "the manifest pins it at the branch tip, not at a release: its pin_tag is a describe-style short sha (`ad10301`) where every tag-tracked source carries a version (`1.5.2`, `v1.6.3`, `2.1.0`), and the newest tag 1.2.0 points at an OLDER commit. Tag tracking would move this pin backwards"

[source."src/lxmf"]
track = "tip"
why = "same upstream practice as src/reticulum: tags lag PyPI (2026-09-25: tag 1.1.0 = master = the current pin, PyPI already 1.1.1), and the maintainer wants the latest development state; the pin_tag is already describe-style, like nomadnet's"

[source."src/sideband"]
track = "tag"

[source."src/meshchat"]
track = "release"
why = "the manifest pins a release version (v2.4.0 = the newest GitHub release, not the branch tip): upstream tags every release and master carries unreleased fixes in between, so the pin follows releases, as meshtastic-firmware does"

# Pinned inputs that are not git sources. Each one is named here so a summary can state its
# status instead of implying the git list is the whole inventory.
# Any automatically tracked entry above or below may carry one more key:
#
#   freeze = "Upstream startup regression; hold the tested revision until the fix is verified."
#
# It holds that input at whatever the manifest pins today while everything else keeps moving. The
# value is the REASON and must be a nonblank string — a bare flag says nothing a maintainer could
# act on months later. Delete the line to thaw; there is no expiry, because elapsed time is not
# evidence that an upstream problem is fixed. A hold on a `manual` or an `owned-by-pin` entry is
# refused: it would read as though it were doing something while it held nothing.

[extra.graywolf]
kind = "github-release"
repo = "chrissnell/graywolf"
track = "release"
why = "the manifest names the version literally and the fetch script carries its sha256 table"

[extra.meshtastic-web]
kind = "github-release"
repo = "meshtastic/web"
track = "release"
why = "the manifest names the release and the sha256 of its build.tar; moving it FORCES a meshtastic binary republish, because the client ships inside that artifact"

[extra.meshtastic-cli]
kind = "pypi"
package = "meshtastic"
track = "release"
why = "a pip version in a build step; the venv is built on the box, but the VERSION is recorded in the completion marker the artifact ships, so moving it forces a meshtastic republish too"

[extra.qemu-esp]
kind = "owned-by-pin"
owner = "src/meshcom-qemu-raspi"
why = "the Espressif QEMU tag lives in that pinned repository's own scripts, so its pin moves with it"
