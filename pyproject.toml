[project]
name = "lhpc-release-bot"
version = "0.1.0"
description = "The scheduled pin release for loraham-pi-control"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Small and frozen, like the controller's: correctness and imports, not style opinions.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
  "S603",  # subprocess with a list argv is how git and gh are driven here
  "S607",  # `git`/`gh` are resolved on PATH on purpose: the runner provides them
  "E501",  # long lines are caught by the formatter's own limit above
  "S310",  # every URL here is built from a fixed API base and a repository name, never input
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]     # asserts are the point
